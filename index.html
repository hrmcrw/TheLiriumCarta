<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050a05">
    <title>The Lirium - Carta</title>
    <meta name="description" content="Carta de The Lirium Craft Bar: para picar, hamburguesas, empanadas, pizzas y tragos con y sin alcohol.">

    <!-- Ícono de la pestaña y del celular (crear estos archivos en la misma carpeta: favicon.png 64x64 y apple-touch-icon.png 180x180) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook, etc.)
         Dirección de la carta: https://hrmcrw.github.io/TheLiriumCarta/
         La imagen preview.jpg debe medir 1200x630 y estar en la misma carpeta. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Lirium Craft Bar">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="The Lirium Craft Bar - Carta">
    <meta property="og:description" content="Mirá la carta: para picar, hamburguesas, empanadas, pizzas y tragos.">
    <meta property="og:url" content="https://hrmcrw.github.io/TheLiriumCarta/">
    <meta property="og:image" content="https://hrmcrw.github.io/TheLiriumCarta/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Velocidad: conexión anticipada a las fuentes y precarga del fondo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="loading-page.png" as="image" fetchpriority="high">
    <link rel="preload" href="fondovertical.webp" as="image" type="image/webp">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050a05;
            --gold: #d4af37;
            --gold-light: #fcf6ba;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --text-color: #f4ecd8;
            --card-bg: rgba(15, 20, 15, 0.78);
            --gold-gradient: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; overscroll-behavior-y: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'EB Garamond', serif;
            font-size: 18px;
            overflow-x: hidden;
            position: relative;
            /* Sin selección de texto (ni menú de mantener apretado en iPhone) */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        img { -webkit-user-drag: none; user-drag: none; }

        /* =========================================
           PANTALLA DE CARGA: fondo negro, el gráfico centrado y la barra debajo
           ========================================= */
        #cargando {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 24px;
            touch-action: none;
            transition: opacity 0.5s ease;
        }
        #cargando.salida { opacity: 0; pointer-events: none; }
        #cargando img { width: min(72vw, 380px); max-height: 55vh; height: auto; object-fit: contain; }
        #cargando-pista {
            width: min(60vw, 260px);
            height: 10px;
            border-radius: 999px;
            background: #000;
            border: 1.5px solid rgba(212, 175, 55, 0.75);
            overflow: hidden;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
        }
        #cargando-barra {
            height: 100%;
            width: 4%;
            border-radius: 999px;
            background: var(--gold-gradient);
            transition: width 0.35s ease;
        }
        /* mientras carga, las animaciones de la página esperan para empezar cuando se muestre */
        body.cargando > :not(#cargando),
        body.cargando > :not(#cargando) * { animation-play-state: paused !important; }
        @media (prefers-reduced-motion: reduce) { #cargando, #cargando-barra { transition: none; } }

        /* =========================================
           1. FONDO (funciona también en iPhone)
           ========================================= */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 120vh;  /* respaldo para navegadores viejos */
            height: 100lvh; /* alto fijo: no cambia cuando la barra del navegador se esconde */
            z-index: -3;
            background-image: url('fondovertical.webp');
            background-size: cover;
            background-position: center;
            filter: brightness(0.35) sepia(0.2) hue-rotate(-10deg);
            transform: translateZ(0);
            will-change: transform;
        }

        /* Onda al tocar: anillos de luz que solo usan transform y opacity (los más livianos para el celular) */
        .onda-anillo {
            position: fixed;
            z-index: 1;
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            border-radius: 50%;
            background: radial-gradient(circle,
                transparent 0%, transparent 56%,
                rgba(212, 175, 55, 0.10) 62%,
                rgba(252, 246, 186, 0.42) 69%,
                rgba(212, 175, 55, 0.14) 75%,
                transparent 82%);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 120vh;  /* respaldo para navegadores viejos */
            height: 100lvh; /* alto fijo: no cambia cuando la barra del navegador se esconde */
            z-index: -2;
            opacity: 0.15;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 120vh;  /* respaldo para navegadores viejos */
            height: 100lvh; /* alto fijo: no cambia cuando la barra del navegador se esconde */
            z-index: -1;
            background: radial-gradient(circle at center, transparent 0%, #000000 100%);
        }

        #magic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 120vh;  /* respaldo para navegadores viejos */
            height: 100lvh; /* alto fijo: no cambia cuando la barra del navegador se esconde */
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px var(--gold);
            opacity: 0;
            animation: floatUp linear infinite, twinkle ease-in-out infinite alternate;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        @keyframes twinkle {
            0% { box-shadow: 0 0 2px 1px rgba(212, 175, 55, 0.2); }
            100% { box-shadow: 0 0 15px 5px var(--gold); }
        }

        /* =========================================
           2. CONTENEDOR Y LOGOTIPO
           ========================================= */
        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 20px calc(var(--bottom-h, 72px) + 24px);
            position: relative;
            z-index: 2;
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes breathe {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.2)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.2)); }
        }

        /* Logo + pestañas: quedan fijos arriba al hacer scroll */
        .top-fixed {
            position: sticky;
            top: 0;
            z-index: 50;
            margin: -20px -20px 10px;
            background: rgba(5, 10, 5, 0.96);
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 8px 24px -10px var(--gold-glow);
        }

        header {
            text-align: center;
            padding: 12px 20px 4px;
        }

        .logo-image-container {
            width: 100%;
            max-width: 190px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 6s ease-in-out infinite;
        }

        .logo-image {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
        }

        /* =========================================
           NAVEGACIÓN FIJA (PESTAÑAS + CATEGORÍAS)
           ========================================= */
        .top-nav {
            padding: 6px 20px 10px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            max-width: 240px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--gold);
            background: transparent;
            padding: 11px 12px;
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-btn:hover { background: rgba(212, 175, 55, 0.12); }

        /* Barra inferior fija (Comidas / Bebidas) */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 55;
            padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
            background: rgba(5, 10, 5, 0.97);
            border-top: 2px solid var(--gold);
            box-shadow: 0 -8px 24px -10px var(--gold-glow);
        }
        .bottom-nav .nav-buttons { max-width: 600px; margin: 0 auto; }
        .bottom-nav .nav-btn { padding: 16px 12px; font-size: 0.92rem; letter-spacing: 1.6px; border-radius: 8px; }

        .nav-btn.active-btn {
            color: #000;
            background: var(--gold-gradient);
            border-color: #fff;
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.6);
        }

        /* Latido suave del botón inactivo: invita a tocarlo */
        @keyframes latido {
            0%, 100% {
                background: transparent;
                border-color: rgba(212, 175, 55, 0.55);
                box-shadow: 0 0 0 rgba(212, 175, 55, 0);
            }
            50% {
                background: rgba(212, 175, 55, 0.22);
                border-color: rgba(252, 246, 186, 0.95);
                box-shadow: 0 0 16px rgba(212, 175, 55, 0.65);
            }
        }
        /* Late solo 3 veces al abrir la carta; cuando la persona ya cambió de pestaña, no vuelve a latir */
        .nav-btn:not(.active-btn) { animation: latido 2.6s ease-in-out 3; }
        body.sin-latido .nav-btn { animation: none; }

        /* Categorías: índice de texto en una sola fila (secundario: los botones principales están abajo) */
        .chips {
            position: relative;
            display: flex;
            gap: 4px;
            margin: 4px -20px 0;
            padding: 0 20px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
        }
        .chips::-webkit-scrollbar { display: none; }
        /* centradas cuando entran; alineadas al inicio y deslizables cuando no entran */
        .chips::before, .chips::after { content: ''; margin: auto; }
        .chips.oculto { display: none; }

        .chip {
            position: relative;
            flex: 0 0 auto;
            display: block;
            padding: 9px 10px 11px;
            white-space: nowrap;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-decoration: none;
            color: rgba(244, 236, 216, 0.6);
            background: none;
            border: 0;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.3s ease;
        }
        .chip::after {
            content: '';
            position: absolute;
            left: 10px; right: 10px; bottom: 4px;
            height: 2px;
            background: var(--gold-gradient);
            transform: scaleX(0);
            transition: transform 0.35s ease;
        }
        /* Separador fino entre las pestañas de comidas y las de bebidas */
        .chip-sep {
            flex: 0 0 auto;
            align-self: center;
            width: 1px;
            height: 14px;
            margin: 0 6px;
            background: rgba(212, 175, 55, 0.5);
        }
        .chip:hover { color: var(--gold-light); }
        .chip.activo { color: var(--gold-light); }
        .chip.activo::after { transform: scaleX(1); }

        /* =========================================
           SISTEMA DE PESTAÑAS (MOSTRAR/OCULTAR)
           ========================================= */
        .seccion-oculta { display: none; }

        /* Entrada lateral al cambiar de pestaña deslizando */
        @keyframes entraDer { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
        @keyframes entraIzq { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
        .seccion-visible.desde-der { animation: entraDer 0.4s ease-out both; }
        .seccion-visible.desde-izq { animation: entraIzq 0.4s ease-out both; }

        .seccion-visible {
            display: block;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           3. TÍTULOS Y PLATOS
           ========================================= */
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            background: var(--gold-gradient);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
            text-align: center;
            margin: 40px 0 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            z-index: 2;
            scroll-margin-top: var(--top-h, 230px);
        }

        .section-title::after {
            content: '❖'; display: block; font-size: 1rem; color: var(--gold);
            margin-top: 5px; -webkit-text-fill-color: var(--gold);
        }

        .menu-item {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 12px; padding: 12px 15px;
            background: var(--card-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3z' fill='%23d4af37' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-left: 3px solid transparent;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease, background 0.4s ease;
        }

        .menu-item:hover, .menu-item:active {
            border-left-color: var(--gold);
            transform: scale(1.02);
            background-color: rgba(25, 35, 25, 0.92);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), 0 0 10px var(--gold-glow);
        }

        .item-name { font-weight: 600; font-size: 1.2rem; padding-right: 10px; display: block; text-shadow: 1px 1px 2px #000; }
        .item-desc { font-size: 1.08rem; line-height: 1.3; color: #e6dec9; font-style: italic; display: block; margin-top: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }


        .item-price {
            font-family: 'Cinzel', serif; font-weight: 800; color: var(--gold);
            font-size: 1.15rem; white-space: nowrap;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .menu-item > div:first-child { min-width: 0; }
        .menu-item .item-price { align-self: flex-end; }

        /* Foto opcional: aparece solo si existe un archivo con el nombre del plato */
        .menu-item.con-espacio { align-items: center; gap: 14px; }
        .menu-item.con-espacio > div:first-of-type { flex: 1; min-width: 0; }
        .menu-item.con-espacio .item-price { align-self: center; }
        /* Espacio de foto reservado desde el inicio: las tarjetas miden lo mismo con o sin foto
           y nada se corre cuando la foto termina de cargar */
        .foto-slot {
            position: relative;
            flex: 0 0 auto;
            width: 96px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .foto-slot::before { content: '❖'; font-size: 1.7rem; color: rgba(212, 175, 55, 0.28); }
        .foto-slot.cargada::before { display: none; }
        .item-foto {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .item-foto.lista { opacity: 1; }
        @media (max-width: 420px) {
            .foto-slot { width: 80px; height: 100px; }
            /* en pantallas angostas los dos precios van en una fila debajo del nombre */
            .menu-item.variantes { flex-wrap: wrap; }
            .menu-item.variantes .item-prices { flex-basis: 100%; flex-direction: row; justify-content: flex-end; gap: 18px; }
        }

        /* Subbotones de Bebidas (mismo estilo que las categorías) */
        .nota {
            text-align: center;
            font-style: italic;
            color: var(--gold);
            margin: -2px 0 8px;
            font-size: 1rem;
        }
        .footer-seguinos {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #aaa;
            margin-bottom: 12px;
        }
        .insta-btn {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: #000;
            background: var(--gold-gradient);
            padding: 12px 22px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 14px rgba(212, 175, 55, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .insta-btn:hover, .insta-btn:active {
            transform: scale(1.04);
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.8);
        }

        /* Variantes de tamaño en una sola tarjeta */
        .menu-item.variantes { align-items: center; }
        .item-prices { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
        .price-row { display: flex; align-items: baseline; gap: 10px; }
        .menu-item .price-row .item-price { align-self: auto; }
        .price-row .size {
            font-size: 0.9rem; font-style: italic; color: #e0d7c0;
            text-transform: uppercase; letter-spacing: 1px;
            min-width: 3.6em; text-align: right;
        }

        /* Layout para los Tragos: imagen | descripción | precio */
        .drink-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-left: 3px solid transparent;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease, background 0.4s ease;
        }

        .drink-item:hover, .drink-item:active {
            border-left-color: var(--gold);
            transform: scale(1.02);
            background: rgba(25, 35, 25, 0.92);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), 0 0 10px var(--gold-glow);
        }

        .drink-img {
            flex: 0 0 auto;
            width: 96px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        .drink-info { flex: 1; min-width: 0; }
        .drink-info .item-desc { margin-top: 0; }
        .drink-item .item-price { align-self: center; }

        /* =========================================
           4. APARICIÓN SUAVE AL HACER SCROLL
           ========================================= */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* =========================================
           5. CHISPAS AL TOCAR (SPARKLES)
           ========================================= */
        .sparkle {
            position: fixed;
            width: 6px; height: 6px;
            background-color: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px 2px var(--gold);
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* =========================================
           6. FOOTER
           ========================================= */
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 40px;
            border-top: 1px solid #333;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Botón de sonido */
        .sound-toggle {
            position: fixed;
            right: 16px;
            bottom: calc(var(--bottom-h, 72px) + 12px);
