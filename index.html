            const desc = it.desc ? '<span class="item-desc">' + it.desc + '</span>' : '';
            if (esTrago) {
                return '<div class="drink-item reveal">' +
                    '<span class="drink-wrap"><img src="' + esc(it.imagen || nombreDeArchivo(it.nombre)) + '.webp" alt="' + esc(it.nombre) + '" class="drink-img" width="96" height="120" loading="lazy" decoding="async" onerror="fotoTragoFaltante(this)"></span>' +
                    '<div class="drink-info">' + nombre + desc + '</div>' +
                    '<span class="item-price">' + precio(it.precio) + '</span></div>';
            }
            const precios = it.tamanos
                ? '<div class="item-prices">' + it.tamanos.map(function(t) {
                    return '<div class="price-row"><span class="size">' + esc(t[0]) + '</span><span class="item-price">' + precio(t[1]) + '</span></div>';
                }).join('') + '</div>'
                : '<div class="item-price">' + precio(it.precio) + (it.unidad ? ' ' + esc(it.unidad) : '') + '</div>';
            return '<div class="menu-item' + (it.tamanos ? ' variantes' : '') + ' reveal"' +
                ' data-foto="' + (it.foto === false ? 'no' : (typeof it.foto === 'string' ? esc(it.foto) : '1')) + '">' +
                '<div>' + nombre + desc + '</div>' + precios + '</div>';
        }

        function htmlCategoria(c) {
            return '<h2 class="section-title reveal" id="' + c.id + '">' + esc(c.titulo) + '</h2>' +
                c.items.map(function(it) { return htmlItem(it, c.tragos); }).join('') +
                (c.nota ? '<p class="nota reveal">' + esc(c.nota) + '</p>' : '');
        }

        // Las pestañas de categorías salen de la misma lista (comidas | bebidas)
        function htmlChip(c) { return '<a class="chip" href="#' + c.id + '">' + esc(c.titulo) + '</a>'; }

        // Arma las dos secciones y las pestañas de categorías con la carta actual
        function dibujarCarta() {
            document.getElementById('seccion-comidas').innerHTML = CARTA.comidas.map(htmlCategoria).join('');
            document.getElementById('seccion-bebidas').innerHTML = CARTA.bebidas.map(htmlCategoria).join('');
            document.getElementById('chips').innerHTML =
                CARTA.comidas.map(htmlChip).join('') + '<span class="chip-sep" aria-hidden="true"></span>' + CARTA.bebidas.map(htmlChip).join('');
        }
        dibujarCarta();

        function medirBarraFija() {
            const t = document.getElementById('top-fixed');
            document.documentElement.style.setProperty('--top-h', (t.offsetHeight + 12) + 'px');
            const b = document.getElementById('bottom-nav');
            if (b) document.documentElement.style.setProperty('--bottom-h', b.offsetHeight + 'px');
        }
        window.addEventListener('load', medirBarraFija);
        window.addEventListener('resize', medirBarraFija);
        medirBarraFija();

        // =========================================
        // 1. APARICIÓN AL HACER SCROLL (un solo observer)
        // =========================================
        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.05, rootMargin: "0px 0px -5% 0px" });

        function observarReveal() { document.querySelectorAll('.reveal:not(.active)').forEach(el => observer.observe(el)); }
        // observarReveal() se llama recién cuando se va la pantalla de carga, para que las tarjetas aparezcan con su animación

        // =========================================
        // 2. CAMBIAR ENTRE PESTAÑAS
        // =========================================
        function mostrarSeccion(seccion, boton, sinScroll) {
            document.getElementById('seccion-comidas').className = 'seccion-oculta';
            document.getElementById('seccion-bebidas').className = 'seccion-oculta';

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active-btn');
                btn.setAttribute('aria-selected', 'false');
            });

            document.getElementById('seccion-' + seccion).className = 'seccion-visible';
            boton.classList.add('active-btn');
            boton.setAttribute('aria-selected', 'true');

            document.body.classList.add('sin-latido'); // ya encontró las pestañas: el botón deja de latir
            medirBarraFija();
            programarChips();
            if (!sinScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // =========================================
        // FOTOS POR NOMBRE
        // Cada tarjeta busca una imagen cuyo nombre es el del plato/bebida:
        // "Papas cheddar & panceta" -> papas-cheddar-y-panceta.webp
        // Si el archivo no existe, la tarjeta queda igual que antes.
        // =========================================
        // Una sola extensión = una sola consulta por plato (antes eran hasta cuatro).
        // Si algún día se usa otro formato, agregarlo acá, por ejemplo ['webp', 'png'].
        const EXTENSIONES_FOTO = ['webp'];

        function nombreDeArchivo(texto) {
            return texto
                .toLowerCase()
                .replace(/&/g, ' y ')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function ponerFoto(tarjeta, base, nombre, i) {
            if (i >= EXTENSIONES_FOTO.length) return;
            const probe = new Image();
            probe.onload = function() {
                if (tarjeta.querySelector('.item-foto')) return; // ya tiene su foto (evita duplicarla)
                const slot = tarjeta.querySelector('.foto-slot');
                const img = document.createElement('img');
                img.src = probe.src;
                img.alt = nombre;
                img.className = 'item-foto';
                img.decoding = 'async';
                slot.appendChild(img);
                slot.classList.add('cargada');
                tarjeta.classList.add('con-foto');
                requestAnimationFrame(function() { img.classList.add('lista'); }); // aparece con un fundido
            };
            probe.onerror = function() { ponerFoto(tarjeta, base, nombre, i + 1); };
            probe.src = base + '.' + EXTENSIONES_FOTO[i];
        }

        const busquedasDeFoto = [];
        function prepararFotos() {
        busquedasDeFoto.length = 0;
        document.querySelectorAll('.menu-item').forEach(function(tarjeta) {
            const el = tarjeta.querySelector('.item-name');
            if (!el) return;
            const nombre = el.textContent.trim();
            // el lugar de la foto se reserva ya, con o sin foto
            const slot = document.createElement('span');
            slot.className = 'foto-slot';
            slot.setAttribute('aria-hidden', 'true');
            tarjeta.classList.add('con-espacio');
            tarjeta.insertBefore(slot, tarjeta.firstChild);
            // Se busca la foto de todos los platos, salvo los marcados con foto: false en CARTA.
            // data-foto trae el nombre del archivo, '1' si coincide con el del plato, o 'no' si no tiene.
            const archivo = tarjeta.dataset.foto;
            if (!archivo || archivo === 'no') return;
            busquedasDeFoto.push(function() { ponerFoto(tarjeta, archivo === '1' ? nombreDeArchivo(nombre) : archivo, nombre, 0); });
        });
        }
        prepararFotos();

        // Las fotos se ponen en las tarjetas cuando la pantalla de carga termina de descargarlas (ver arrancarCarga)
        function lanzarBusquedasDeFoto() { busquedasDeFoto.forEach(function(buscar) { buscar(); }); }

        // =========================================
        // 3. PARTÍCULAS (menos cantidad = más fluido)
        // =========================================
        if (!reducirMovimiento) {
            const bg = document.getElementById('magic-bg');
            const particleCount = window.innerWidth < 768 ? 12 : 28;

            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.classList.add('particle');
                let size = Math.random() * 3 + 1.5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 15 + 10}s, ${Math.random() * 2 + 1}s`;
                particle.style.animationDelay = `${Math.random() * 10}s, 0s`;
                bg.appendChild(particle);
            }
        }

        // =========================================
        // 4. CHISPAS AL TOCAR (un solo evento, sin duplicados)
        // =========================================
        function createSparkles(x, y) {
            for (let i = 0; i < 6; i++) {
                let spark = document.createElement('div');
                spark.classList.add('sparkle');
                spark.style.left = `${x}px`;
                spark.style.top = `${y}px`;

                let angle = Math.random() * Math.PI * 2;
                let velocity = Math.random() * 50 + 20;
                spark.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
                spark.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);

                document.body.appendChild(spark);
                setTimeout(() => { spark.remove(); }, 800);
            }
        }

        if (!reducirMovimiento) {
            document.body.addEventListener('pointerdown', function(e) {
                createSparkles(e.clientX, e.clientY);
            });
        }

        // =========================================
        // 4b. ONDA AL TOCAR (liviana)
        // Dos anillos de luz que se expanden desde el punto tocado.
        // Solo se animan transform y opacity, que el celular resuelve sin esfuerzo.
        // =========================================
        let ondasActivas = 0;

        function lanzarOnda(x, y) {
            if (ondasActivas >= 3) return; // si tocan sin parar, no se acumulan
            const alto = window.innerHeight, ancho = window.innerWidth;
            const escalaMax = (Math.hypot(Math.max(x, ancho - x), Math.max(y, alto - y)) * 2.1) / 300;
            [0, 140].forEach(function(retraso, i) {
                const anillo = document.createElement('div');
                anillo.className = 'onda-anillo';
                anillo.style.left = x + 'px';
                anillo.style.top = y + 'px';
                document.body.appendChild(anillo);
                ondasActivas++;
                const anim = anillo.animate(
                    [{ transform: 'scale(0.05)', opacity: i ? 0.14 : 0.25 }, { transform: 'scale(' + escalaMax + ')', opacity: 0 }],
                    { duration: 1300, delay: retraso, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)', fill: 'both' }
                );
                const quitar = function() { anillo.remove(); ondasActivas--; };
                anim.finished.then(quitar, quitar);
            });
        }

        if (!reducirMovimiento) {
            window.addEventListener('pointerdown', function(e) {
                // con el zoom abierto el fondo está tapado: no hace falta
                if (document.getElementById('zoom').classList.contains('abierto')) return;
                if (e.target.closest && e.target.closest('#sound-toggle, #arriba-btn, #bottom-nav')) return;
                lanzarOnda(e.clientX, e.clientY);
            }, { passive: true });
        }

        // =========================================
        // 5. SONIDO AL TOCAR Y MANTENER
        // Arpegio descendente y staccato desde el agudo, con reverb larga.
        // Triada mayor con novena o con cuarta aumentada (#11), raíz distinta en cada toque.
        // Mientras el dedo sigue apretado el arpegio se repite y el timbre se va modulando de a poco.
        // =========================================
        let audioCtx = null, notaBus = null, tonoFiltro = null, wetGain = null, dryGain = null;
        let sonidoActivo = false, ultimaRaiz = -1, sesion = null, pulsado = false; // arranca silenciado
        const DURACION_MINIMA = 0.5; // un toque corto igual completa el arpegio
        const botonSonido = document.getElementById('sound-toggle');

        function crearReverb(ctx) {
            const dur = 4.5, rate = ctx.sampleRate, len = Math.floor(rate * dur);
            const buf = ctx.createBuffer(2, len, rate);
            for (let c = 0; c < 2; c++) {
                const d = buf.getChannelData(c);
                for (let i = 0; i < len; i++) {
                    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
                }
            }
            const conv = ctx.createConvolver();
            conv.buffer = buf;
            return conv;
        }

        function iniciarAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();

            const comp = audioCtx.createDynamicsCompressor();
            comp.threshold.value = -24;
            comp.ratio.value = 4;

            const master = audioCtx.createGain();
            master.gain.value = 1.1;

            dryGain = audioCtx.createGain();
            dryGain.gain.value = 0.45;
            wetGain = audioCtx.createGain();
            wetGain.gain.value = 0.9;

            tonoFiltro = audioCtx.createBiquadFilter();
            tonoFiltro.type = 'lowpass';
            tonoFiltro.frequency.value = 1000;

            const rev = crearReverb(audioCtx);
            const revTono = audioCtx.createBiquadFilter();
            revTono.type = 'lowpass';
            revTono.frequency.value = 1500;

            notaBus = audioCtx.createGain();
            notaBus.connect(tonoFiltro);
            tonoFiltro.connect(dryGain);
            tonoFiltro.connect(rev);
            rev.connect(revTono);
            revTono.connect(wetGain);

            // Delay del sonido al tocar: 50% de feedback y mezcla baja
            const delay = audioCtx.createDelay(1.5);
            delay.delayTime.value = 0.36;
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.65;
            const delayMix = audioCtx.createGain();
            delayMix.gain.value = 0.2;
            tonoFiltro.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(delayMix);
            delayMix.connect(comp);
            dryGain.connect(comp);
            wetGain.connect(comp);
            comp.connect(master);
            master.connect(audioCtx.destination);
        }

        // Una nota corta de cuerdas: dos sierras apenas desafinadas, con filtro que se cierra
        function tocarNota(freq, t0, vel, dur, det, destino, vib) {
            const ctx = audioCtx;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(vel, t0 + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

            const f = ctx.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.setValueAtTime(Math.min(freq * 2, 2200), t0);
            f.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.9, 300), t0 + dur);

            // Una sierra suave (cuerda) + una triangular (cuerpo redondo y opaco)
            [['sawtooth', -det, 0.35], ['triangle', det, 1]].forEach(([tipo, d, nivel]) => {
                const o = ctx.createOscillator();
                o.type = tipo;
                o.frequency.value = freq;
                o.detune.value = d;
                if (vib) vib.connect(o.detune);
                const og = ctx.createGain();
                og.gain.value = nivel;
                o.connect(og);
                og.connect(f);
                o.start(t0);
                o.stop(t0 + dur + 0.05);
            });

            f.connect(g);
            g.connect(destino);
        }

        // Triada mayor + novena (2) o cuarta aumentada (6), con raíz distinta a la anterior
        function nuevaTriada() {
            let raiz;
            do { raiz = Math.floor(Math.random() * 12); } while (raiz === ultimaRaiz);
            ultimaRaiz = raiz;
            const ext = Math.random() < 0.5 ? 2 : 6;
            return [0, 4, 7, ext].map(x => (raiz + x) % 12);
        }

        // Notas de la triada de arriba hacia abajo; al modular, el arpegio baja cada vez más
        function notasDe(clases, piso) {
            const notas = [];
            for (let m = 96; m >= piso; m--) {
                if (clases.includes(m % 12)) notas.push(m);
            }
            return notas;
        }

        function planificar() {
            const s = sesion;
            if (!s) return;
            const ctx = s.ctx;
            const ahora = ctx.currentTime;
            const h = ahora - s.inicio;
            const p = 1 - Math.exp(-h / 6); // 0 al empezar, tiende a 1 de forma gradual

            // Modulación gradual del timbre
            tonoFiltro.frequency.setTargetAtTime(1000 + 700 * p + 250 * Math.sin(h * 0.9), ahora, 0.08);
            wetGain.gain.setTargetAtTime(0.9 + 0.5 * p, ahora, 0.4);
            dryGain.gain.setTargetAtTime(0.45 - 0.15 * p, ahora, 0.4);
            s.vib.gain.setTargetAtTime(30 * p, ahora, 0.3);

            while (s.proximo < ahora + 0.12) {
                if (s.idx >= s.notas.length) {
                    s.notas = notasDe(s.clases, Math.round(79 - 19 * p));
                    s.idx = 0;
                    s.proximo += 0.05 + 0.25 * p; // pausa entre repeticiones, cada vez más amplia
                }
                const m = s.notas[s.idx];
                const freq = 440 * Math.pow(2, (m - 69) / 12);
                const vel = Math.max(0.035, 0.065 * (1 - s.idx * 0.05)) * (1 - 0.25 * p);
                const dur = 0.16 + 0.45 * p;      // de staccato a notas más largas
                const det = 6 + 18 * p;           // el ensamble se va abriendo
                tocarNota(freq, s.proximo + Math.random() * 0.008, vel, dur, det, s.hold, s.vib);
                s.idx++;
                s.proximo += 0.065 + 0.05 * p;
            }
        }

        function empezarSostenido() {
            if (!audioCtx || !sonidoActivo || audioCtx.state !== 'running') return;
            if (sesion) { clearTimeout(sesion.finTimer); terminarSostenido(); }

            const ctx = audioCtx;
            const t0 = ctx.currentTime;

            const hold = ctx.createGain();
            hold.gain.setValueAtTime(0.0001, t0);
            hold.gain.exponentialRampToValueAtTime(1, t0 + 0.02);
            hold.connect(notaBus);

            const lfo = ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 4.8;
            const vib = ctx.createGain();
            vib.gain.value = 0;
            lfo.connect(vib);
            lfo.start(t0);

            sesion = {
                ctx, hold, lfo, vib,
                clases: nuevaTriada(),
                notas: [], idx: 0,
                inicio: t0, proximo: t0 + 0.02,
                timer: null, finTimer: null
            };
            planificar();
            sesion.timer = setInterval(planificar, 25);
        }

        function terminarSostenido() {
            const s = sesion;
            if (!s) return;
            sesion = null;
            clearInterval(s.timer);
            const t = s.ctx.currentTime;
            s.hold.gain.cancelScheduledValues(t);
            s.hold.gain.setValueAtTime(Math.max(s.hold.gain.value, 0.0001), t);
            s.hold.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
            try { s.lfo.stop(t + 0.3); } catch (e) {}
            setTimeout(() => { try { s.hold.disconnect(); } catch (e) {} }, 1500);
            // la cola de reverb sigue sonando sola
        }

        function soltarSostenido() {
            const s = sesion;
            if (!s) return;
            const restante = DURACION_MINIMA - (s.ctx.currentTime - s.inicio);
            if (restante > 0) {
                s.finTimer = setTimeout(() => { if (sesion === s) terminarSostenido(); }, restante * 1000);
            } else {
                terminarSostenido();
            }
        }

        function alPulsar(e) {
            if (e.target.closest && e.target.closest('#sound-toggle')) return;
            if (!sonidoActivo) return; // silenciado: no se prepara el audio (ahorra batería y carga)
            pulsado = true;
            iniciarAudio();
            if (audioCtx && audioCtx.state === 'running') {
                empezarSostenido();
            } else if (audioCtx) {
                audioCtx.resume().then(() => { if (pulsado && !sesion) empezarSostenido(); }).catch(() => {});
            }
        }

        function alSoltar() {
            if (!pulsado) return;
            pulsado = false;
            if (!audioCtx) return;
            // En el primer toque el navegador recién habilita el audio al soltar: suena un acorde corto
            audioCtx.resume().then(() => {
                if (!sesion) empezarSostenido();
                soltarSostenido();
            }).catch(() => {});
        }

        window.addEventListener('pointerdown', alPulsar, { passive: true });
        window.addEventListener('pointerup', alSoltar, { passive: true });
        window.addEventListener('pointercancel', alSoltar, { passive: true });
        window.addEventListener('blur', alSoltar);
        document.addEventListener('visibilitychange', () => { if (document.hidden) alSoltar(); });

        // Algunos navegadores (iPhone) solo habilitan el audio con estos eventos
        ['touchend', 'click', 'keydown'].forEach(ev => {
            window.addEventListener(ev, iniciarAudio, { passive: true });
        });

        // =========================================
        // ZOOM: tocar un plato/bebida lo agranda; tocar de nuevo vuelve al scroll
        // =========================================
        const zoomEl = document.getElementById('zoom');
        const zoomFondo = document.getElementById('zoom-fondo');
        const zoomImg = document.getElementById('zoom-img');
        const zoomTextos = [
            { destino: document.getElementById('zoom-nombre'), origen: '.item-name',  retraso: 70 },
            { destino: document.getElementById('zoom-desc'),   origen: '.item-desc',  retraso: 130 },
            { destino: document.getElementById('zoom-precio'), origen: '.item-prices, .item-price', retraso: 190 }
        ];
        const SELECTOR_FOTO = '.item-foto, .drink-img';
        const EASE_ZOOM = 'cubic-bezier(0.22, 0.9, 0.25, 1)';
        const zoomBarra = document.getElementById('top-fixed'); // logo + botones
        const DUR_BARRA = 450;
        const zoomBarraInf = document.getElementById('bottom-nav'); // Comidas / Bebidas
        function distanciaBarraInf() { return Math.ceil(zoomBarraInf.getBoundingClientRect().height) + 40; }
        let zoomTarjeta = null, zoomAnimando = false, zoomBarraAnim = null, zoomBarraInfAnim = null;
        let zoomBloqueado = false, zoomScrollY = 0, zoomHistoria = false;
        const zoomPrev = document.getElementById('zoom-prev');
        const zoomNext = document.getElementById('zoom-next');
        const zoomContador = document.getElementById('zoom-contador');
        const zoomDeslizar = document.getElementById('zoom-deslizar');
        const zoomExtras = ['zoom-cerrar', 'zoom-ayuda', 'zoom-prev', 'zoom-next', 'zoom-contador', 'zoom-deslizar'].map(id => document.getElementById(id));

        // Pista de deslizar: las primeras veces que se abre el zoom, la foto se mece un poco hacia los costados
        let zoomPista = [], pistasMostradas = 0;
        function cancelarPista() { zoomPista.forEach(a => a.cancel()); zoomPista = []; }
        function mostrarPista() {
            if (reducirMovimiento || pistasMostradas >= 2 || !zoomTarjeta || tarjetasZoom().length < 2) return;
            pistasMostradas++;
            const partes = [zoomImg].concat(zoomTextos.map(t => t.destino));
            zoomPista = partes.map(e => e.animate(
                [{ transform: 'none' }, { transform: 'translateY(-30px)', offset: 0.3 }, { transform: 'translateY(30px)', offset: 0.7 }, { transform: 'none' }],
                { duration: 1200, delay: 500, easing: 'ease-in-out' }
            ));
        }

        function centroDe(r) { return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

        // Distancia que hay que subir la barra para que salga completa de la pantalla
        function distanciaBarra() { return Math.ceil(zoomBarra.getBoundingClientRect().height) + 40; }
        function barraY(px) { return 'translateY(' + px + 'px)'; }

        // Transformación que lleva la imagen ampliada a la posición y tamaño de la foto en la carta
        function transformImagen(foto) {
            const s = foto.getBoundingClientRect();
            const d = zoomImg.getBoundingClientRect();
            const iw = foto.naturalWidth || 1, ih = foto.naturalHeight || 1;
            const ajuste = (w, h) => Math.min(w / iw, h / ih); // object-fit: contain
            const k = ajuste(s.width, s.height) / ajuste(d.width, d.height);
            const cs = centroDe(s), cd = centroDe(d);
            return 'translate(' + (cs.x - cd.x) + 'px, ' + (cs.y - cd.y) + 'px) scale(' + k + ')';
        }

        // Lo mismo para cada texto (origen arriba-izquierda), escalando por tamaño de letra
        function transformTexto(destino, origen) {
            if (!origen) return null;
            const s = origen.getBoundingClientRect();
            const d = destino.getBoundingClientRect();
            if (!d.width || !d.height) return null;
            const k = parseFloat(getComputedStyle(origen).fontSize) / parseFloat(getComputedStyle(destino).fontSize);
            return 'translate(' + (s.left - d.left) + 'px, ' + (s.top - d.top) + 'px) scale(' + k + ')';
        }

        // Pasa la foto y los textos de una tarjeta al zoom
        function cargarEnZoom(tarjeta) {
            const foto = tarjeta.querySelector(SELECTOR_FOTO);
            zoomImg.decoding = 'sync';
            zoomImg.src = foto.currentSrc || foto.src;
            zoomImg.alt = foto.alt;
            zoomTextos.forEach(function(t) {
                const o = tarjeta.querySelector(t.origen);
                t.destino.innerHTML = o ? o.innerHTML.trim() : '';
            });
            if (!tarjeta.querySelector('.item-name')) zoomTextos[0].destino.textContent = foto.alt;
            return foto;
        }

        // Platos con foto de la pestaña actual, en orden (para pasar al anterior / siguiente)
        function tarjetasZoom() {
            const seccion = zoomTarjeta.closest('#seccion-comidas, #seccion-bebidas');
            return Array.from(seccion.querySelectorAll('.menu-item, .drink-item')).filter(t => t.querySelector(SELECTOR_FOTO));
        }

        function actualizarFlechas() {
            const lista = tarjetasZoom(), i = lista.indexOf(zoomTarjeta);
            zoomPrev.style.visibility = i > 0 ? 'visible' : 'hidden';
            zoomNext.style.visibility = i < lista.length - 1 ? 'visible' : 'hidden';
            // contador y pista solo si hay más de un producto para recorrer
            zoomContador.textContent = (i + 1) + ' / ' + lista.length;
            const hayMas = lista.length > 1;
            zoomContador.style.visibility = hayMas ? 'visible' : 'hidden';
            zoomDeslizar.style.visibility = hayMas ? 'visible' : 'hidden';
        }

        // Si la tarjeta nueva quedó fuera de pantalla, se la trae a la vista (sin animar)
        function traerAVista(t) {
            const r = t.getBoundingClientRect();
            const alto = window.innerHeight;
            if (r.top >= zoomBarra.offsetHeight + 12 && r.bottom <= alto - 20) return;
            const destino = window.scrollY + r.top - (alto / 2 - r.height / 2);
            window.scrollTo({ top: Math.max(0, destino), behavior: 'instant' });
            zoomScrollY = window.scrollY;
        }

        // Pasar al plato anterior (-1) o siguiente (+1) sin cerrar el zoom
        function navegarZoom(dir) {
            if (zoomAnimando || !zoomEl.classList.contains('abierto') || !zoomTarjeta) return;
            const lista = tarjetasZoom();
            const nueva = lista[lista.indexOf(zoomTarjeta) + dir];
            if (!nueva) return;
            cancelarPista();
            zoomAnimando = true;
            const vieja = zoomTarjeta;
            const mover = 70 * dir;
            const partes = [zoomImg].concat(zoomTextos.map(t => t.destino));
            const salida = partes.map(e => e.animate(
                [{ transform: 'none', opacity: 1 }, { transform: 'translateY(' + (-mover) + 'px)', opacity: 0 }],
                { duration: 180, easing: 'ease-in', fill: 'forwards' }
            ));
            Promise.all(salida.map(a => a.finished)).catch(function() {}).then(function() {
                try {
                    // la tarjeta anterior vuelve a mostrarse completa
                    const fv = vieja.querySelector(SELECTOR_FOTO);
                    if (fv) fv.style.visibility = '';
                    zoomTextos.forEach(function(t) {
                        const o = vieja.querySelector(t.origen);
                        if (o) o.style.visibility = '';
                    });
                    zoomTarjeta = nueva;
                    traerAVista(nueva);
                    const foto = cargarEnZoom(nueva);
                    foto.style.visibility = 'hidden';
                    zoomTextos.forEach(function(t) {
                        const o = nueva.querySelector(t.origen);
                        if (o) o.style.visibility = 'hidden';
                    });
                    actualizarFlechas();
                } catch (err) {}
                salida.forEach(a => a.cancel());
                const entrada = partes.map((e, i) => e.animate(
                    [{ transform: 'translateY(' + mover + 'px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
                    { duration: 300, delay: i * 40, easing: EASE_ZOOM, fill: 'backwards' }
                ));
                Promise.all(entrada.map(a => a.finished)).catch(function() {}).then(function() { zoomAnimando = false; });
            });
        }

        // ABRIR: 1) sube la barra del logo y los botones, 2) recién después se agranda la foto
        function abrirZoom(tarjeta) {
            const foto = tarjeta.querySelector(SELECTOR_FOTO);
            if (!foto || zoomAnimando) return; // sin foto no hay nada que agrandar
            ocultarPistaTocar(); // ya descubrió el gesto: el aviso no vuelve a salir
            recordarPistaTocar();
            zoomTarjeta = tarjeta;
            zoomAnimando = true;

            // El zoom se apoya en el historial: el botón "atrás" del celular consume esta entrada y lo cierra
            try { history.pushState({ zoom: true }, ''); zoomHistoria = true; } catch (err) { zoomHistoria = false; }

            cargarEnZoom(tarjeta);

            // El scroll se frena sin tocar "overflow": el body tiene overflow-x oculto y, si el html
            // también se bloquea, el body pasa a ser el contenedor de scroll y la barra pegajosa salta.
            zoomScrollY = window.scrollY;
            zoomBloqueado = true;

            const px = distanciaBarra();
            zoomBarraAnim = zoomBarra.animate(
                [{ transform: barraY(0) }, { transform: barraY(-px) }],
                { duration: DUR_BARRA, easing: EASE_ZOOM, fill: 'forwards' }
            );
            zoomBarraInfAnim = zoomBarraInf.animate(
                [{ transform: barraY(0) }, { transform: barraY(distanciaBarraInf()) }],
                { duration: DUR_BARRA, easing: EASE_ZOOM, fill: 'forwards' }
            );
            const paso2 = function() {
                try { ampliar(tarjeta, foto); } catch (err) { zoomAnimando = false; }
            };
            zoomBarraAnim.finished.then(paso2, paso2);
        }

        function ampliar(tarjeta, foto) {
            zoomEl.classList.add('abierto');
            zoomEl.setAttribute('aria-hidden', 'false');

            // Se mide con todo en su lugar final y recién después se anima
            const origenes = zoomTextos.map(t => tarjeta.querySelector(t.origen));
            const tImg = transformImagen(foto);
            const tTextos = zoomTextos.map((t, i) => transformTexto(t.destino, origenes[i]));

            // Lo que se agranda "sale" de la carta: el original se oculta mientras dura el zoom
            foto.style.visibility = 'hidden';
            origenes.forEach(o => { if (o) o.style.visibility = 'hidden'; });

            const dur = 540;
            const anims = [];
            anims.push(zoomFondo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur * 0.7, easing: 'ease-out' }));
            anims.push(zoomImg.animate([{ transform: tImg }, { transform: 'none' }], { duration: dur, easing: EASE_ZOOM }));
            zoomTextos.forEach(function(t, i) {
                if (!tTextos[i]) return;
                anims.push(t.destino.animate([
                    { transform: tTextos[i], opacity: 0 },
                    { opacity: 1, offset: 0.3 },
                    { transform: 'none', opacity: 1 }
                ], { duration: dur, delay: t.retraso, easing: EASE_ZOOM, fill: 'backwards' }));
            });
            actualizarFlechas();
            zoomExtras.forEach(function(e) {
                e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 380, fill: 'backwards' });
            });
            Promise.all(anims.map(a => a.finished)).catch(function() {}).then(function() { zoomAnimando = false; mostrarPista(); });
        }

        // CERRAR: 1) la foto vuelve a su lugar, 2) recién después baja la barra del logo y los botones
        function cerrarZoom() {
            if (!zoomEl.classList.contains('abierto') || zoomAnimando || !zoomTarjeta) return;
            cancelarPista(); // si la foto se estaba meciendo, se frena antes de medir
            const tarjeta = zoomTarjeta;
            const foto = tarjeta.querySelector(SELECTOR_FOTO);
            const origenes = zoomTextos.map(t => tarjeta.querySelector(t.origen));
            zoomAnimando = true;

            const dur = 440;
            const anims = [];
            anims.push(zoomFondo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur, easing: 'ease-in', fill: 'forwards' }));
            zoomExtras.forEach(function(e) {
                anims.push(e.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }));
            });
            anims.push(zoomImg.animate([{ transform: 'none' }, { transform: transformImagen(foto) }], { duration: dur, easing: EASE_ZOOM, fill: 'forwards' }));
            zoomTextos.forEach(function(t, i) {
                const tr = transformTexto(t.destino, origenes[i]);
                if (!tr) return;
                anims.push(t.destino.animate([
                    { transform: 'none', opacity: 1 },
                    { opacity: 1, offset: 0.55 },
                    { transform: tr, opacity: 0 }
                ], { duration: dur, easing: EASE_ZOOM, fill: 'forwards' }));
                // el texto original reaparece suavemente en su lugar al llegar
                origenes[i].style.visibility = '';
                origenes[i].animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur * 0.45, delay: dur * 0.55, fill: 'backwards' });
            });

            Promise.all(anims.map(a => a.finished)).catch(function() {}).then(function() {
                // La foto ya está en su lugar: se saca el zoom y recién ahora baja la barra
                zoomEl.getAnimations({ subtree: true }).forEach(a => a.cancel());
                zoomEl.classList.remove('abierto');
                zoomEl.setAttribute('aria-hidden', 'true');
                if (foto) foto.style.visibility = '';

                const px = distanciaBarra();
                if (zoomBarraAnim) zoomBarraAnim.cancel();
                const bajar = zoomBarra.animate(
                    [{ transform: barraY(-px) }, { transform: barraY(0) }],
                    { duration: DUR_BARRA, easing: EASE_ZOOM, fill: 'both' }
                );
                zoomBarraAnim = bajar;
                if (zoomBarraInfAnim) zoomBarraInfAnim.cancel();
                const subir = zoomBarraInf.animate(
                    [{ transform: barraY(distanciaBarraInf()) }, { transform: barraY(0) }],
                    { duration: DUR_BARRA, easing: EASE_ZOOM, fill: 'both' }
                );
                zoomBarraInfAnim = subir;
                const fin = function() {
                    bajar.cancel();
                    subir.cancel();
                    zoomBarraAnim = null;
                    zoomBarraInfAnim = null;
                    zoomBloqueado = false;
                    zoomTarjeta = null;
                    zoomAnimando = false;
                };
                bajar.finished.then(fin, fin);
            });
        }

        // Pedir el cierre = volver atrás en el historial; el listener de "popstate" hace el cierre animado.
        // Así el botón atrás, el gesto de volver, la ✕ y Escape pasan todos por el mismo camino.
        function pedirCierreZoom() {
            if (!zoomEl.classList.contains('abierto')) return;
            if (zoomHistoria) { try { history.back(); return; } catch (err) {} }
            zoomHistoria = false;
            cerrarZoom();
        }
        // Si "atrás" llega en medio de una animación, se espera a que termine y recién ahí se cierra
        function cerrarCuandoPueda() {
            if (!zoomEl.classList.contains('abierto') && !zoomAnimando) return;
            if (zoomAnimando || !zoomEl.classList.contains('abierto')) { setTimeout(cerrarCuandoPueda, 80); return; }
            cerrarZoom();
        }
        window.addEventListener('popstate', function() {
            if (!zoomHistoria) return;
            zoomHistoria = false;
            cerrarCuandoPueda();
        });

        let ignorarClickHasta = 0;
        document.addEventListener('click', function(e) {
            if (performance.now() < ignorarClickHasta) return; // el toque final de un deslizamiento no cierra
            if (zoomAnimando) return;
            if (zoomEl.classList.contains('abierto')) {
                // Con el zoom abierto, tocar la pantalla ya no lo cierra: solo flechas y ✕
                const flecha = e.target.closest('.zoom-flecha');
                if (flecha) { navegarZoom(flecha.id === 'zoom-next' ? 1 : -1); return; }
                if (e.target.closest('#zoom-cerrar')) pedirCierreZoom();
                return;
            }
            const tarjeta = e.target.closest('.menu-item, .drink-item');
            if (tarjeta) abrirZoom(tarjeta);
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') pedirCierreZoom();
            if (e.key === 'ArrowDown') navegarZoom(1);
            if (e.key === 'ArrowUp') navegarZoom(-1);
        });
        // Rueda del mouse o trackpad dentro del zoom: plato siguiente (hacia abajo) / anterior (hacia arriba).
        // Con una pausa corta para que el impulso del trackpad no salte varios platos de una vez.
        let ruedaHasta = 0;
        window.addEventListener('wheel', function(e) {
            if (!zoomEl.classList.contains('abierto') || Math.abs(e.deltaY) < 20 || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
            if (performance.now() < ruedaHasta) return;
            ruedaHasta = performance.now() + 700;
            navegarZoom(e.deltaY > 0 ? 1 : -1);
        }, { passive: true });
        // Deslizar el dedo hacia arriba / abajo dentro del zoom, como el scroll: plato siguiente / anterior
        let swipeX = 0, swipeY = 0, swipeActivo = false;
        zoomEl.addEventListener('pointerdown', function(e) { swipeX = e.clientX; swipeY = e.clientY; swipeActivo = true; });
        zoomEl.addEventListener('pointercancel', function() { swipeActivo = false; });
        zoomEl.addEventListener('pointerup', function(e) {
            if (!swipeActivo) return;
            swipeActivo = false;
            const dx = e.clientX - swipeX, dy = e.clientY - swipeY;
            if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.5) {
                ignorarClickHasta = performance.now() + 400;
                navegarZoom(dy < 0 ? 1 : -1); // dedo hacia arriba = siguiente, igual que al scrollear la lista
            }
        });
        // Bloqueo del scroll mientras dura el zoom (rueda, dedo y teclado)
        function frenarScroll(e) { if (zoomBloqueado) e.preventDefault(); }
        window.addEventListener('wheel', frenarScroll, { passive: false });
        document.addEventListener('touchmove', frenarScroll, { passive: false });
        window.addEventListener('keydown', function(e) {
            if (zoomBloqueado && [' ', 'PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
        });
        // Respaldo (por ejemplo, si arrastran la barra de scroll): vuelve al mismo punto
        window.addEventListener('scroll', function() {
            if (zoomBloqueado && window.scrollY !== zoomScrollY) window.scrollTo({ top: zoomScrollY, behavior: 'instant' });
        });

// =========================================
        // CATEGORÍA ACTUAL RESALTADA + VOLVER ARRIBA
        // =========================================
        const arribaBtn = document.getElementById('arriba-btn');

        let chipVisto = null;
        function actualizarChips() {
            const grupo = document.getElementById('chips');
            const todos = Array.from(grupo.querySelectorAll('a.chip'));
            // solo cuentan las categorías de la pestaña que está a la vista (las otras están ocultas)
            const chips = todos.filter(function(c) {
                const t = document.querySelector(c.getAttribute('href'));
                return t && t.offsetParent !== null;
            });
            if (chips.length) {
                const limite = document.getElementById('top-fixed').offsetHeight + 40;
                let activo = chips[0];
                chips.forEach(function(c) {
                    const t = document.querySelector(c.getAttribute('href'));
                    if (t && t.getBoundingClientRect().top <= limite) activo = c;
                });
                // al llegar al final de la página queda marcada la última
                if (window.scrollY > 0 && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) activo = chips[chips.length - 1];
                todos.forEach(c => c.classList.toggle('activo', c === activo));
                if (activo !== chipVisto) {
                    chipVisto = activo;
                    if (grupo.scrollWidth > grupo.clientWidth + 2) {
                        grupo.scrollTo({ left: activo.offsetLeft - (grupo.clientWidth - activo.offsetWidth) / 2, behavior: 'smooth' });
                    }
                }
            }
            arribaBtn.classList.toggle('visible', window.scrollY > 500);
        }

        // Tocar una categoría: si está en la otra pestaña, se cambia de pestaña y se va directo a ella
        function topAbsoluto(el) { let y = 0; while (el) { y += el.offsetTop; el = el.offsetParent; } return y; }
        // Un solo oyente sobre el contenedor: sigue funcionando si la carta se vuelve a dibujar
        document.getElementById('chips').addEventListener('click', function(e) {
            const chip = e.target.closest('a.chip');
            if (!chip) return;
            e.preventDefault();
            if (zoomAnimando || zoomEl.classList.contains('abierto')) return;
            const destino = document.querySelector(chip.getAttribute('href'));
            if (!destino) return;
            const seccion = destino.closest('#seccion-comidas, #seccion-bebidas').id.replace('seccion-', '');
            const enComidas = document.getElementById('seccion-comidas').classList.contains('seccion-visible');
            if ((seccion === 'comidas') !== enComidas) {
                mostrarSeccion(seccion, document.getElementById('tab-' + seccion), true);
                document.getElementById('seccion-' + seccion).classList.add(seccion === 'bebidas' ? 'desde-der' : 'desde-izq');
            }
            const alturaBarra = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-h')) || 230;
            window.scrollTo({ top: Math.max(0, topAbsoluto(destino) - alturaBarra), behavior: 'smooth' });
        });

        let chipsPendiente = false;
        function programarChips() {
            if (chipsPendiente) return;
            chipsPendiente = true;
            requestAnimationFrame(function() { chipsPendiente = false; actualizarChips(); });
        }
        window.addEventListener('scroll', programarChips, { passive: true });
        window.addEventListener('resize', programarChips);
        window.addEventListener('load', programarChips);
        arribaBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        programarChips();

// =========================================
        // DESLIZAR A LOS COSTADOS: cambia entre Comidas y Bebidas
        // =========================================
        function cambiarPestana(seccion, dir) {
            mostrarSeccion(seccion, document.getElementById('tab-' + seccion));
            document.getElementById('seccion-' + seccion).classList.add(dir > 0 ? 'desde-der' : 'desde-izq');
        }

        let tabX = 0, tabY = 0, tabT = 0, tabValido = false;
        document.addEventListener('touchstart', function(e) {
            const t = e.touches[0];
            // se ignoran los bordes de la pantalla (gesto de "volver" del celular) y el zoom
            tabValido = e.touches.length === 1 && !zoomAnimando && !zoomEl.classList.contains('abierto') &&
                !e.target.closest('#bottom-nav, #zoom, #chips') && t.clientX > 24 && t.clientX < window.innerWidth - 24;
            tabX = t.clientX; tabY = t.clientY; tabT = Date.now();
        }, { passive: true });
        document.addEventListener('touchend', function(e) {
            if (!tabValido) return;
            tabValido = false;
            if (zoomAnimando || zoomEl.classList.contains('abierto')) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - tabX, dy = t.clientY - tabY;
            if (Date.now() - tabT > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
            const enComidas = document.getElementById('seccion-comidas').classList.contains('seccion-visible');
            if (dx < 0 && enComidas) cambiarPestana('bebidas', 1);
            else if (dx > 0 && !enComidas) cambiarPestana('comidas', -1);
        }, { passive: true });

// =========================================
        // AVISO "TOCÁ UNA FOTO": sale unos segundos en cada visita, hasta que la persona abre un zoom por primera vez
        // =========================================
        const pistaTocar = document.getElementById('pista-tocar');
        const CLAVE_PISTA_TOCAR = 'lirium-pista-tocar-v2';
        let pistaTocarTimer = null;

        function pistaTocarYaVista() {
            try { return localStorage.getItem(CLAVE_PISTA_TOCAR) === '1'; } catch (e) { return false; }
        }
        function recordarPistaTocar() {
            try { localStorage.setItem(CLAVE_PISTA_TOCAR, '1'); } catch (e) {}
        }
        function ocultarPistaTocar() {
            clearTimeout(pistaTocarTimer);
            pistaTocar.classList.remove('visible');
        }
        function hayFotoVisible() {
            return Array.from(document.querySelectorAll('.con-foto, .drink-img')).some(function(e) { return e.offsetParent !== null; });
        }
        // Las fotos se cargan después de lo principal: se reintenta unas veces hasta que haya alguna a la vista
        function intentarPistaTocar(n) {
            if (pistaTocarYaVista()) return;
            if (hayFotoVisible()) {
                pistaTocar.classList.add('visible');
                pistaTocarTimer = setTimeout(ocultarPistaTocar, 6000);
            } else if (n < 4) {
                setTimeout(function() { intentarPistaTocar(n + 1); }, 1500);
            }
        }
        function agendarPistaTocar() { setTimeout(function() { intentarPistaTocar(0); }, 2500); }
        // (se agenda desde terminarCarga, cuando la pantalla de carga ya se fue)

// =========================================
        // PLANILLA DE GOOGLE: lee la carta publicada como CSV y actualiza la página si cambió
        // Primera fila de la hoja (encabezados):
        // pestana, categoria, nota_categoria, nombre, descripcion, aclaracion,
        // precio, tamano_1, tamano_2, precio_2, unidad, imagen, foto, visible
        // =========================================
        function parsearCSV(texto) {
            const filas = [];
            let fila = [], campo = '', enComillas = false;
            if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];
                if (enComillas) {
                    if (c === '"') {
                        if (texto[i + 1] === '"') { campo += '"'; i++; } else enComillas = false;
                    } else campo += c;
                } else if (c === '"') enComillas = true;
                else if (c === ',') { fila.push(campo); campo = ''; }
                else if (c === '\n' || c === '\r') {
                    if (c === '\r' && texto[i + 1] === '\n') i++;
                    fila.push(campo); campo = ''; filas.push(fila); fila = [];
                } else campo += c;
            }
            if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }
            return filas;
        }

        function claveColumna(t) {
            return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
                .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        }
        // "$20.000", "20000" o "20.000,00" -> 20000 (los precios son enteros)
        function numeroDe(t) {
            const s = String(t == null ? '' : t).trim().replace(/[.,]\d{2}$/, '').replace(/\D/g, '');
            return s ? parseInt(s, 10) : null;
        }
        function quitarExtension(t) { return String(t).trim().replace(/\.(webp|png|jpe?g)$/i, ''); }
        const ES_NO = /^(no|n|0|false|oculto|agotado)$/i;

        function cartaDesdeCSV(texto) {
            const filas = parsearCSV(texto).filter(function(f) { return f.some(function(c) { return String(c).trim() !== ''; }); });
            if (filas.length < 2) return null;
            const cab = filas[0].map(claveColumna);
            if (cab.indexOf('nombre') < 0) return null; // no es la hoja de la carta (por ejemplo, una página de acceso de Google)
            const carta = { comidas: [], bebidas: [] };
            const categorias = {}, ids = {};
            filas.slice(1).forEach(function(f) {
                const r = {};
                cab.forEach(function(k, i) { r[k] = f[i] == null ? '' : String(f[i]).trim(); });
                if (!r.nombre || ES_NO.test(r.visible || '')) return;
                const pestana = /^b/i.test(r.pestana) ? 'bebidas' : 'comidas';
                const titulo = r.categoria || 'Otros';
                const clave = pestana + '|' + titulo.toLowerCase();
                let cat = categorias[clave];
                if (!cat) {
                    let id = nombreDeArchivo(titulo) || 'categoria';
                    while (ids[id]) id += pestana === 'bebidas' ? '-b' : '-c';
                    ids[id] = true;
                    cat = categorias[clave] = { id: id, titulo: titulo, items: [] };
                    carta[pestana].push(cat);
                }
                if (r.nota_categoria && !cat.nota) cat.nota = r.nota_categoria;
                const item = { nombre: r.nombre };
                // la descripción se escapa siempre; la aclaración va en cursiva en una segunda línea
                const desc = esc(r.descripcion || '') + (r.aclaracion ? (r.descripcion ? '<br>' : '') + '<em>' + esc(r.aclaracion) + '</em>' : '');
                if (desc) item.desc = desc;
                if (r.tamano_1) {
                    item.tamanos = [[r.tamano_1, numeroDe(r.precio)]];
                    if (r.tamano_2) item.tamanos.push([r.tamano_2, numeroDe(r.precio_2)]);
                } else item.precio = numeroDe(r.precio);
                if (r.unidad) item.unidad = r.unidad;
                if (r.imagen) { item.imagen = quitarExtension(r.imagen); cat.tragos = true; }
                if (ES_NO.test(r.foto || '') && r.foto) item.foto = false;
                else if (r.foto) item.foto = quitarExtension(r.foto);
                cat.items.push(item);
            });
            if (!carta.comidas.length && !carta.bebidas.length) return null;
            return carta;
        }

        // Vuelve a dibujar la carta cuando la planilla trae cambios (espera si hay una foto agrandada)
        function repintarCarta() {
            if (zoomAnimando || zoomEl.classList.contains('abierto')) { setTimeout(repintarCarta, 1000); return; }
            dibujarCarta();
            if (cargaTerminada) document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('active'); }); // sin parpadeo
            prepararFotos();
            lanzarBusquedasDeFoto();
            chipVisto = null;
            medirBarraFija();
            programarChips();
        }

        async function cargarDesdePlanilla() {
            if (!URL_PLANILLA) return;
            try {
                const ctl = new AbortController();
                const corte = setTimeout(function() { ctl.abort(); }, 10000);
                const resp = await fetch(URL_PLANILLA, { cache: 'no-store', signal: ctl.signal });
                clearTimeout(corte);
                if (!resp.ok) return;
                const nueva = cartaDesdeCSV(await resp.text());
                if (!nueva) return; // si la planilla viene vacía o rota, queda la carta que ya se ve
                const igual = JSON.stringify(nueva) === JSON.stringify(CARTA);
                try { localStorage.setItem(CLAVE_CACHE_CARTA, JSON.stringify(nueva)); } catch (e) {}
                if (!igual) { CARTA = nueva; repintarCarta(); }
            } catch (e) { /* sin conexión o planilla no disponible: queda la carta que ya se ve */ }
        }

        // =========================================
        // PANTALLA DE CARGA: lee la planilla, descarga todas las fotos y recién ahí muestra la carta
        // =========================================
        const pantallaCarga = document.getElementById('cargando');
        const barraCarga = document.getElementById('cargando-barra');
        function progresoCarga(p) { if (barraCarga) barraCarga.style.width = Math.max(4, Math.min(100, p * 100)) + '%'; }
        function pausa(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }
        function precargarImagen(url) {
            return new Promise(function(listo) {
                const i = new Image();
                i.onload = i.onerror = function() { listo(); }; // si una foto no existe, también cuenta como lista
                i.src = url;
            });
        }
        function urlsDeFotos() {
            const urls = ['fondovertical.webp', 'logo.webp'];
            document.querySelectorAll('.menu-item').forEach(function(t) {
                const a = t.dataset.foto, n = t.querySelector('.item-name');
                if (!a || a === 'no' || !n) return;
                urls.push((a === '1' ? nombreDeArchivo(n.textContent.trim()) : a) + '.' + EXTENSIONES_FOTO[0]);
            });
            document.querySelectorAll('.drink-img').forEach(function(i) { urls.push(i.getAttribute('src')); });
            return urls.filter(function(u, i) { return u && urls.indexOf(u) === i; });
        }

        function terminarCarga() {
            if (cargaTerminada) return;
            cargaTerminada = true;
            document.body.classList.remove('cargando');
            observarReveal();
            medirBarraFija();
            programarChips();
            if (pantallaCarga) {
                pantallaCarga.classList.add('salida');
                setTimeout(function() { pantallaCarga.remove(); }, 600);
            }
            agendarPistaTocar();
        }

        async function arrancarCarga() {
            const inicio = Date.now();
            progresoCarga(0.05);
            try {
                // 1) la carta definitiva (planilla), con tope de 5 segundos
                await Promise.race([cargarDesdePlanilla(), pausa(5000)]);
                // 2) todas las fotos y las fuentes, con tope de 15 segundos
                const urls = urlsDeFotos();
                let hechas = 0;
                const total = urls.length + 1;
                const paso = function() { hechas++; progresoCarga(0.1 + 0.9 * hechas / total); };
                const tareas = urls.map(function(u) { return precargarImagen(u).then(paso); });
                tareas.push(Promise.resolve(document.fonts && document.fonts.ready).catch(function() {}).then(paso));
                await Promise.race([Promise.all(tareas), pausa(15000)]);
                // 3) las fotos ya están en caché: se ponen en las tarjetas antes de mostrar la carta
                lanzarBusquedasDeFoto();
                await pausa(250);
                const resto = 700 - (Date.now() - inicio); // que la pantalla no parpadee si todo cargó muy rápido
                if (resto > 0) await pausa(resto);
                progresoCarga(1);
                await pausa(200);
            } catch (e) { /* ante cualquier problema, se muestra la carta igual */ }
            terminarCarga();
        }
        setTimeout(terminarCarga, 25000); // seguro: nunca queda trabada la pantalla de carga
        arrancarCarga();

botonSonido.addEventListener('click', function() {
            iniciarAudio();
            sonidoActivo = !sonidoActivo;
            botonSonido.textContent = sonidoActivo ? '🔊' : '🔇';
            botonSonido.classList.toggle('off', !sonidoActivo);
            if (!sonidoActivo) { pulsado = false; terminarSostenido(); }
        });
    </script>
